.nav-right{margin-left:auto;display:flex;align-items:center;gap:12px}.lang,.download{height:48px;border-radius:26px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;font-family:"DM Sans",Arial,sans-serif;font-size:14px;line-height:1;transition:transform .2s ease,background .2s ease,box-shadow .2s ease}.lang{padding:0 18px;gap:8px;background:rgba(20,18,16,.72);border:1px solid rgba(255,255,255,.25);color:#fff;font-weight:600;box-shadow:0 8px 22px rgba(0,0,0,.16);backdrop-filter:blur(8px);cursor:pointer}.lang .globe{font-size:15px;opacity:.9}.lang .chev{font-size:12px;opacity:.8;margin-left:1px}.download{padding:0 23px;border:1px solid rgba(255,215,125,.55);background:linear-gradient(135deg,#ffd875 0%,#f3b62f 100%);color:#17120a;text-decoration:none;font-weight:800;box-shadow:0 10px 26px rgba(0,0,0,.28)}.lang:hover,.download:hover{transform:translateY(-1px)}.download:hover{box-shadow:0 13px 30px rgba(0,0,0,.34)}

.stores{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:34px}.store{height:62px;min-width:205px;padding:0 22px;border:1px solid rgba(255,255,255,.85);border-radius:10px;background:rgba(0,0,0,.48);color:#fff;text-decoration:none;display:flex;align-items:center;gap:12px;box-shadow:0 8px 22px rgba(0,0,0,.22);backdrop-filter:blur(3px)}.store .small{font-size:10px;display:block;line-height:1.1;letter-spacing:.2px}.store .big{font-size:20px;line-height:1.1;font-weight:700;display:block}.play-icon{width:29px;height:29px;display:grid;place-items:center;font-size:25px;color:#fff}.apple-icon{font-size:31px;line-height:1}

@media (max-width:1250px){.wrap{width:min(1160px,calc(100% - 48px))}.nav{gap:24px}.links{gap:23px}.hero-grid{grid-template-columns:52% 48%}.phone{width:min(245px,23vw)}h1{font-size:clamp(50px,5vw,70px)}.sub{font-size:17px}.stat{min-width:118px;padding:0 13px}.stat strong{font-size:18px}}
@media (max-width:900px){.hero{min-height:1080px;height:auto;max-height:none;background-position:center top}.hero:after{background:linear-gradient(180deg,rgba(4,3,2,.45),rgba(4,3,2,.72) 60%,rgba(4,3,2,.48))}.wrap{width:calc(100% - 36px)}.nav{height:88px}.logo{width:82px;height:82px;border-radius:14px;margin-top:0}.logo .en{font-size:19px}.logo .ar{font-size:17px;margin-top:4px}.links,.nav-right{display:none}.mobile-nav{margin-left:auto;display:flex;gap:10px}.mobile-nav button{width:44px;height:44px;border:1px solid rgba(255,255,255,.25);border-radius:50%;background:rgba(20,18,16,.68);color:#fff;font-size:20px}.hero-grid{height:auto;display:flex;flex-direction:column;align-items:stretch;padding-top:24px}.copy{max-width:650px;padding:0 0 12px}.eyebrow{font-size:12px;letter-spacing:3.2px;margin-bottom:13px}h1{font-size:clamp(45px,11vw,65px);line-height:.98;letter-spacing:-1.6px;margin-bottom:18px}.sub{font-size:16px;max-width:550px;margin-bottom:23px}.stores{margin-bottom:24px}.store{height:54px;min-width:170px;padding:0 15px}.store .big{font-size:16px}.stats{display:grid;grid-template-columns:1fr 1fr;max-width:520px;row-gap:15px}.stat{border-right:0;padding:0 8px 0 0;min-width:0}.stat:nth-child(odd){border-right:1px solid rgba(255,255,255,.25)}.phones{height:560px;width:100%;padding:10px 0 45px;gap:0;align-items:flex-end}.phone{width:min(42vw,245px);border-radius:32px;padding:6px}.phone:before{border-radius:30px}.phone img{border-radius:27px}.phone.left{transform:translate(15px,10px) rotate(-5deg)}.phone.right{transform:translate(-5px,0) rotate(5deg)}.phone-floor{bottom:7%;width:90%;height:70px}}
@media (max-width:520px){.hero{min-height:1050px}.wrap{width:calc(100% - 28px)}.nav{height:76px}.logo{width:70px;height:70px}.logo .en{font-size:16px}.logo .ar{font-size:14px}.hero-grid{padding-top:18px}.eyebrow{font-size:10px;letter-spacing:2.5px}h1{font-size:43px}.sub{font-size:15px}.stores{gap:9px}.store{min-width:0;flex:1;height:52px;padding:0 11px}.store .big{font-size:14px}.store .small{font-size:8px}.stats{grid-template-columns:1fr 1fr;gap:12px 8px}.stat:nth-child(odd){border-right:1px solid rgba(255,255,255,.22)}.stat-icon{font-size:22px}.stat strong{font-size:17px}.stat small{font-size:10px}.phones{height:490px;padding-bottom:28px}.phone{width:44vw;max-width:205px;border-radius:27px}.phone img{border-radius:23px}.phone:before{border-radius:25px}.phone:after{height:17px}.phone.left{transform:translate(10px,12px) rotate(-4deg)}.phone.right{transform:translate(-7px,0) rotate(4deg)}}


/* =========================
   MOBILE HERO MICRO-INTERACTIONS
   ========================= */
@media(max-width:700px){
  .mobile-start-grid.three-only .start-card{
    will-change:transform,box-shadow,border-color;
    transition:transform .22s cubic-bezier(.2,.8,.2,1),
               border-color .22s ease,
               box-shadow .22s ease,
               background .22s ease;
  }
  .mobile-start-grid.three-only .start-card::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    background:radial-gradient(circle at 50% 20%,rgba(245,184,61,.13),transparent 52%);
    opacity:0;
    transition:opacity .22s ease;
    pointer-events:none;
  }
  .mobile-start-grid.three-only .start-card:hover,
  .mobile-start-grid.three-only .start-card:focus-visible{
    transform:translateY(-4px);
    border-color:rgba(245,184,61,.78);
    box-shadow:0 18px 40px rgba(0,0,0,.45),0 0 24px rgba(245,184,61,.10),inset 0 1px 0 rgba(255,255,255,.07);
    outline:none;
  }
  .mobile-start-grid.three-only .start-card:hover::after,
  .mobile-start-grid.three-only .start-card:focus-visible::after{opacity:1}
  .mobile-start-grid.three-only .start-card:hover .start-icon,
  .mobile-start-grid.three-only .start-card:focus-visible .start-icon{
    box-shadow:0 0 24px rgba(245,184,61,.16),inset 0 1px 0 rgba(255,255,255,.08);
    transform:translateY(-1px);
  }
  .mobile-start-grid.three-only .start-icon{
    transition:transform .22s ease,box-shadow .22s ease;
  }
  .mobile-start-grid.three-only .start-arrow{
    transition:transform .22s ease,background .22s ease,border-color .22s ease;
  }
  .mobile-start-grid.three-only .start-card:hover .start-arrow,
  .mobile-start-grid.three-only .start-card:focus-visible .start-arrow{
    transform:translateX(2px);
    background:rgba(245,184,61,.12);
    border-color:rgba(245,184,61,.8);
  }
  [dir="rtl"] .mobile-start-grid.three-only .start-card:hover .start-arrow,
  [dir="rtl"] .mobile-start-grid.three-only .start-card:focus-visible .start-arrow{transform:translateX(-2px)}

  .official-store{
    position:relative;
    cursor:pointer;
    touch-action:manipulation;
    will-change:transform,box-shadow;
    transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease,background .2s ease;
  }
  .official-store::after{
    content:"";
    position:absolute;
    inset:1px;
    border-radius:inherit;
    background:linear-gradient(105deg,transparent 25%,rgba(255,255,255,.11) 50%,transparent 75%);
    transform:translateX(-120%);
    transition:transform .55s ease;
    pointer-events:none;
  }
  .official-store:hover,
  .official-store:focus-visible{
    transform:translateY(-3px);
    border-color:var(--gold2);
    box-shadow:0 16px 32px rgba(0,0,0,.42),0 0 24px rgba(245,184,61,.11);
    outline:none;
  }
  .official-store:hover::after,
  .official-store:focus-visible::after{transform:translateX(120%)}
  .official-store:active{transform:scale(.975)}
  .official-store img{transition:transform .2s ease,filter .2s ease}
  .official-store:hover img,.official-store:focus-visible img{transform:scale(1.025)}

  .start-scroll-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    flex:0 0 auto;
  }
  .start-scroll-label{
    color:rgba(255,255,255,.48);
    font-size:8px;
    letter-spacing:2.6px;
    text-transform:uppercase;
    line-height:1;
  }
  .start-scroll{margin:0 auto -1px}

  .mobile-start.is-entering .mobile-start-head,
  .mobile-start.is-entering .mobile-start-grid,
  .mobile-start.is-entering .start-downloads,
  .mobile-start.is-entering .start-scroll-wrap{
    animation:hidayaHeroIn .65s cubic-bezier(.2,.8,.2,1) both;
  }
  .mobile-start.is-entering .mobile-start-grid{animation-delay:.12s}
  .mobile-start.is-entering .start-downloads{animation-delay:.22s}
  .mobile-start.is-entering .start-scroll-wrap{animation-delay:.34s}
  @keyframes hidayaHeroIn{
    from{opacity:0;transform:translateY(12px)}
    to{opacity:1;transform:translateY(0)}
  }
  @media(prefers-reduced-motion:reduce){
    .mobile-start.is-entering .mobile-start-head,
    .mobile-start.is-entering .mobile-start-grid,
    .mobile-start.is-entering .start-downloads,
    .mobile-start.is-entering .start-scroll-wrap{animation:none}
    .mobile-start-grid.three-only .start-card,.official-store{transition:none}
  }
}

/* =========================
   ABOUT / HIDAYA ECOSYSTEM
   ========================= */
.about{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 42%,rgba(245,184,61,.08),transparent 28%),
    linear-gradient(180deg,#100d0b 0%,#080706 100%);
  padding:120px 0 130px;
  isolation:isolate;
}
.about:before{
  content:"";
  position:absolute;
  inset:0;
  opacity:.20;
  background-image:
    linear-gradient(30deg,rgba(245,184,61,.10) 12%,transparent 12.5%,transparent 87%,rgba(245,184,61,.10) 87.5%,rgba(245,184,61,.10)),
    linear-gradient(150deg,rgba(245,184,61,.07) 12%,transparent 12.5%,transparent 87%,rgba(245,184,61,.07) 87.5%,rgba(245,184,61,.07));
  background-size:84px 146px;
  mask-image:linear-gradient(to bottom,transparent,#000 12%,#000 88%,transparent);
  pointer-events:none;
}
.about:after{
  content:"";
  position:absolute;
  width:760px;height:760px;
  left:50%;top:43%;
  transform:translate(-50%,-50%);
  border:1px solid rgba(245,184,61,.08);
  border-radius:50%;
  box-shadow:
    0 0 0 70px rgba(245,184,61,.018),
    0 0 0 140px rgba(245,184,61,.012);
  pointer-events:none;
}
.about-wrap{width:min(1380px,calc(100% - 80px));margin:auto;position:relative;z-index:2}
.about-heading{text-align:center;max-width:900px;margin:0 auto 78px}
.about-kicker{
  display:inline-flex;align-items:center;gap:13px;
  color:var(--gold);font-size:12px;letter-spacing:5px;font-weight:700;
  text-transform:uppercase;margin-bottom:19px;
}
.about-kicker:before,.about-kicker:after{content:"";width:42px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.about-kicker:after{transform:scaleX(-1)}
.about h2{
  font-family:"Playfair Display",Georgia,serif;
  font-size:clamp(43px,5vw,72px);
  line-height:1.02;letter-spacing:-2px;margin:0 0 22px;font-weight:800;
}
.about h2 span{color:var(--gold)}
.about-lead{font-size:18px;line-height:1.7;color:rgba(255,255,255,.72);max-width:760px;margin:auto}
.about-core{
  width:230px;height:230px;margin:0 auto 78px;
  border:1px solid rgba(245,184,61,.34);border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;
  background:radial-gradient(circle,rgba(245,184,61,.10),rgba(10,8,7,.92) 68%);
  box-shadow:0 0 70px rgba(245,184,61,.08),inset 0 0 45px rgba(245,184,61,.04);
}
.about-core:before,.about-core:after{
  content:"";position:absolute;border:1px solid rgba(245,184,61,.13);border-radius:50%;
}
.about-core:before{inset:-24px}
.about-core:after{inset:-52px}
.core-mark{
  width:62px;height:62px;border:1px solid rgba(245,184,61,.65);border-radius:18px;
  display:grid;place-items:center;color:var(--gold);font-family:"Playfair Display",serif;
  font-size:25px;transform:rotate(45deg);margin-bottom:15px;
}
.core-mark span{transform:rotate(-45deg)}
.core-title{font-family:"Playfair Display",serif;font-size:28px;color:#fff;font-weight:700}
.core-ar{color:var(--gold);font-size:19px;margin-top:4px;font-weight:700}
.core-meta{font-size:9px;letter-spacing:3px;color:rgba(255,255,255,.48);margin-top:9px}
.about-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:16px;
  position:relative;
}
.feature-card{
  min-height:218px;padding:29px 28px 27px;
  border:1px solid rgba(245,184,61,.17);border-radius:22px;
  background:linear-gradient(145deg,rgba(31,25,20,.82),rgba(10,9,8,.90));
  box-shadow:0 18px 45px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.035);
  position:relative;overflow:hidden;transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;
}
.feature-card:before{
  content:"";position:absolute;left:0;top:0;width:100%;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.55;
}
.feature-card:after{
  content:"";position:absolute;width:110px;height:110px;border-radius:50%;
  right:-55px;top:-55px;background:rgba(245,184,61,.055);filter:blur(2px);
}
.feature-card:hover{
  transform:translateY(-5px);
  border-color:rgba(245,184,61,.42);
  box-shadow:0 22px 55px rgba(0,0,0,.34),0 0 28px rgba(245,184,61,.06);
}
.feature-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.feature-num{font-size:10px;letter-spacing:3px;color:rgba(245,184,61,.65);font-weight:700}
.feature-icon{
  width:44px;height:44px;border-radius:14px;
  border:1px solid rgba(245,184,61,.38);display:grid;place-items:center;
  color:var(--gold);font-size:19px;background:rgba(245,184,61,.05);
}
.feature-card h3{
  font-family:"Playfair Display",Georgia,serif;font-size:23px;line-height:1.15;
  margin:0 0 10px;color:#fff;
}
.feature-card p{margin:0;color:rgba(255,255,255,.62);font-size:14px;line-height:1.65;max-width:340px}
.feature-card.wide{grid-column:span 2}
.about-foot{
  margin:74px auto 0;display:flex;align-items:center;justify-content:center;gap:22px;
  color:rgba(255,255,255,.42);font-size:11px;letter-spacing:3px;text-transform:uppercase;
}
.about-foot:before,.about-foot:after{content:"";height:1px;width:120px;background:linear-gradient(90deg,transparent,rgba(245,184,61,.35))}
.about-foot:after{transform:scaleX(-1)}
@media (max-width:900px){
  .about{padding:90px 0 100px}
  .about-wrap{width:calc(100% - 36px)}
  .about-heading{margin-bottom:58px}
  .about h2{font-size:clamp(39px,9vw,58px)}
  .about-lead{font-size:16px}
  .about-core{margin-bottom:58px;width:200px;height:200px}
  .about-grid{grid-template-columns:1fr 1fr}
  .feature-card.wide{grid-column:span 1}
}
@media (max-width:520px){
  .about{padding:78px 0 82px}
  .about-wrap{width:calc(100% - 28px)}
  .about-kicker{font-size:9px;letter-spacing:3px}
  .about h2{font-size:38px;letter-spacing:-1px}
  .about-lead{font-size:15px;line-height:1.6}
  .about-core{width:175px;height:175px;margin-bottom:48px}
  .core-mark{width:52px;height:52px;font-size:21px;margin-bottom:10px}
  .core-title{font-size:24px}
  .about-grid{grid-template-columns:1fr;gap:12px}
  .feature-card{min-height:190px;padding:24px 22px}
  .feature-card h3{font-size:21px}
  .feature-card p{font-size:13px}
  .about-foot{margin-top:52px;font-size:9px;gap:12px}
  .about-foot:before,.about-foot:after{width:45px}
}

  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 22%,rgba(245,184,61,.10),transparent 28%),
    linear-gradient(180deg,#080706 0%,#120d0a 48%,#090807 100%);
  padding:120px 0 130px;
  isolation:isolate;
}
.screenshots:before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.12;

<script>
(function(){
 const API='https://api.alquran.cloud/v1', audio=new Audio(); audio.preload='metadata';
 const sel=document.getElementById('surahSelect'), play=document.getElementById('playAudio'), seek=document.getElementById('seek'), cur=document.getElementById('currentTime'), dur=document.getElementById('duration'), title=document.getElementById('surahTitle'), arabic=document.getElementById('surahArabic'), status=document.getElementById('audioStatus'), auto=document.getElementById('autoNext'), nextName=document.getElementById('nextName'), nextArabic=document.getElementById('nextArabic'), nextNum=document.getElementById('nextNum');
 let n=Number(localStorage.getItem('hidayaAudioSurah'))||1;
 const esc=s=>String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));
 const fmt=s=>{s=Math.max(0,Math.floor(s||0));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
 async function init(){try{const r=await fetch(`${API}/surah`,{cache:'force-cache'}),j=await r.json();sel.innerHTML=j.data.map(x=>`<option value="${x.number}" data-ar="${esc(x.name)}">${x.number}. ${esc(x.englishName)}</option>`).join('');sel.value=String(n);updateMeta();}catch(e){sel.innerHTML='<option value="1">1. Al-Fatihah</option>'}};
 function updateMeta(){const opt=sel.selectedOptions[0];if(!opt)return; n=Number(opt.value); localStorage.setItem('hidayaAudioSurah',String(n)); title.textContent=opt.textContent.replace(/^\d+\.\s*/,''); arabic.textContent=opt.dataset.ar||''; const next=n<114?n+1:1; const no=[...sel.options].find(o=>Number(o.value)===next); if(no){nextNum.textContent=next;nextName.textContent=no.textContent.replace(/^\d+\.\s*/,'');nextArabic.textContent=no.dataset.ar||'';}}
 function load(playNow=false){audio.pause();audio.src=`https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/${n}.mp3`;audio.load();updateMeta();status.textContent=playNow?'Loading recitation…':'';if(playNow)audio.play().catch(()=>status.textContent='Press Play to start the recitation.');}
 sel.addEventListener('change',()=>{n=Number(sel.value);load(false)}); play.addEventListener('click',()=>audio.paused?audio.play().catch(()=>{}):audio.pause());
 document.getElementById('prevAudio').addEventListener('click',()=>{n=n>1?n-1:114;sel.value=String(n);load(true)});document.getElementById('nextAudio').addEventListener('click',()=>{n=n<114?n+1:1;sel.value=String(n);load(true)});
 audio.addEventListener('play',()=>{play.textContent='❚❚';status.textContent='Recitation is playing';});audio.addEventListener('pause',()=>{play.textContent='▶'});audio.addEventListener('loadedmetadata',()=>{dur.textContent=fmt(audio.duration)});audio.addEventListener('timeupdate',()=>{cur.textContent=fmt(audio.currentTime);seek.value=audio.duration?(audio.currentTime/audio.duration*100):0});seek.addEventListener('input',()=>{if(audio.duration)audio.currentTime=Number(seek.value)/100*audio.duration});audio.addEventListener('ended',()=>{if(auto.checked){n=n<114?n+1:1;sel.value=String(n);load(true)}else{play.textContent='▶';status.textContent='Surah finished'}});
 init().then(()=>load(false));
})();
